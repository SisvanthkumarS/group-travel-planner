openapi: 3.1.0
info:
  title: Group Travel Planner
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email or username is already registered.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Sign in with email or a unique username and set an HttpOnly JWT
        cookie.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid login credentials.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: Clear the browser cookie; a previously issued JWT is not revoked
        server-side.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/v1/trips:
    get:
      tags:
      - Trip Management
      summary: List Trips
      operationId: list_trips_api_v1_trips_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TripResponse'
                type: array
                title: Response List Trips Api V1 Trips Get
        '401':
          description: Authentication required.
    post:
      tags:
      - Trip Management
      summary: Create Trip
      operationId: create_trip_api_v1_trips_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '401':
          description: Authentication required.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}:
    get:
      tags:
      - Trip Management
      summary: Get Trip
      description: Get trip details and the complete member list; trip membership
        required.
      operationId: get_trip_api_v1_trips__trip_id__get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '401':
          description: Authentication required.
        '403':
          description: Trip membership required.
        '404':
          description: Trip not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Trip Management
      summary: Delete Trip
      description: Delete a trip as its Organizer; return an empty 204 response.
      operationId: delete_trip_api_v1_trips__trip_id__delete
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      responses:
        '204':
          description: Successful Response
        '401':
          description: Authentication required.
        '403':
          description: Organizer required.
        '404':
          description: Trip not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/invitations:
    post:
      tags:
      - Invitations
      summary: Create Invitation
      description: Create a pending invitation by email or user_name; Organizer only.
      operationId: create_invitation_api_v1_trips__trip_id__invitations_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication required.
        '403':
          description: Organizer required.
        '404':
          description: Trip or registered recipient not found.
        '409':
          description: Already a member or invitation already pending.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invitations:
    get:
      tags:
      - Invitations
      summary: List Invitations
      description: List all invitations received by the current user, newest first.
      operationId: list_invitations_api_v1_invitations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InvitationResponse'
                type: array
                title: Response List Invitations Api V1 Invitations Get
        '401':
          description: Authentication required.
    patch:
      tags:
      - Invitations
      summary: Respond To Invitation
      description: Accept or decline a pending invitation; only its recipient can
        respond.
      operationId: respond_to_invitation_api_v1_invitations_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondInvitationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication required.
        '403':
          description: Only the recipient can respond.
        '404':
          description: Invitation or trip not found.
        '409':
          description: Already answered, already a member, or trip is full.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/proposals:
    post:
      tags:
      - Activity Proposals
      summary: Create Proposal
      description: 'Submit a PENDING proposal as a trip participant.


        Activity times must be in the future and within the travel dates in the trip''s
        timezone.

        Description and non-negative estimated cost are required. At most 100 proposals

        are allowed per trip, including withdrawn and canceled proposals.'
      operationId: create_proposal_api_v1_trips__trip_id__proposals_post
      security:
      - CookieAuth: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Trip already contains 100 proposals.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Activity Proposals
      summary: List Proposals
      description: 'List all proposals, statuses, counts, poll outcomes and voting
        history; members only.


        Includes WITHDRAWN, REJECTED and CANCELLED proposals. Poll outcomes and tie

        decisions are retained after cancellation. Returns an empty array when none
        exist.'
      operationId: list_proposals_api_v1_trips__trip_id__proposals_get
      security:
      - CookieAuth: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProposalResponse'
                title: Response List Proposals Api V1 Trips  Trip Id  Proposals Get
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/proposals/{proposal_id}/withdraw:
    post:
      tags:
      - Activity Proposals
      summary: Withdraw Proposal
      description: 'Author only: withdraw a PENDING or OPEN proposal before the poll
        deadline.


        An open poll is canceled without an outcome. Existing votes and history remain,

        and further voting, opening a poll, or resolution is prohibited.'
      operationId: withdraw_proposal_api_v1_proposals__proposal_id__withdraw_post
      security:
      - CookieAuth: []
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Proposal Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Proposal is not PENDING/OPEN or poll deadline has passed.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/proposals/{proposal_id}/poll:
    post:
      tags:
      - Polls and Voting
      summary: Open Poll
      description: 'Organizer only: open a pending proposal''s poll and snapshot all
        current participants.


        The organizer and proposal author are eligible. Deadline must be after now
        and

        before the activity start. The internal scheduler closes polls automatically:

        more YES than NO approves and adds an itinerary item exactly once; more NO
        or

        zero votes rejects; equal nonzero counts produces TIED. No quorum is required.

        There is no public poll-closing endpoint.'
      operationId: open_poll_api_v1_proposals__proposal_id__poll_post
      security:
      - CookieAuth: []
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Proposal Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPollRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Proposal is not PENDING or already has a poll.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/polls/{poll_id}/vote:
    put:
      tags:
      - Polls and Voting
      summary: Vote
      description: 'Cast or update one YES/NO vote as an eligible participant strictly
        before the deadline.


        Eligibility is fixed at poll opening. Changed choices preserve the old choice
        in

        history; repeating the current choice is idempotent. Votes are rejected at
        the

        deadline even if the scheduler has not yet processed the poll.'
      operationId: vote_api_v1_polls__poll_id__vote_put
      security:
      - CookieAuth: []
      parameters:
      - name: poll_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Poll Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Poll/proposal is not OPEN or deadline reached.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/polls/{poll_id}/resolve:
    post:
      tags:
      - Polls and Voting
      summary: Resolve Poll
      description: 'Organizer only: approve or reject an automatically closed, tied
        proposal.


        Approval adds the activity to the itinerary exactly once. The original TIED

        outcome and the organizer''s resolution are both retained. Does not close
        polls.'
      operationId: resolve_poll_api_v1_polls__poll_id__resolve_post
      security:
      - CookieAuth: []
      parameters:
      - name: poll_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Poll Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolvePollRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Poll has no unresolved TIED proposal.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/itinerary:
    get:
      tags:
      - Shared Itinerary
      summary: Get Itinerary
      description: 'Members only: retrieve active approved activities ordered by starts_at
        then item_id.


        Canceled activities are excluded. Returns an empty array when no active items
        exist.'
      operationId: get_itinerary_api_v1_trips__trip_id__itinerary_get
      security:
      - CookieAuth: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItineraryItemResponse'
                title: Response Get Itinerary Api V1 Trips  Trip Id  Itinerary Get
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/itinerary/{item_id}:
    delete:
      tags:
      - Shared Itinerary
      summary: Cancel Itinerary Item
      description: 'Organizer only: cancel an approved activity belonging to this
        trip.


        Sets the proposal and itinerary item to CANCELLED, preserving poll outcomes
        and

        voting history. Already canceled items also return an empty 204 response.'
      operationId: cancel_itinerary_item_api_v1_trips__trip_id__itinerary__item_id__delete
      security:
      - CookieAuth: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Trip Id
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Item Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CreateInvitationRequest:
      properties:
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        user_name:
          anyOf:
          - type: string
            maxLength: 30
            minLength: 1
          - type: 'null'
          title: User Name
      type: object
      title: CreateInvitationRequest
    CreateProposalRequest:
      properties:
        title:
          type: string
          minLength: 1
          title: Title
        description:
          type: string
          minLength: 1
          title: Description
        estimated_cost:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          title: Estimated Cost
        location:
          type: string
          minLength: 1
          title: Location
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
      type: object
      required:
      - title
      - description
      - estimated_cost
      - location
      - starts_at
      - ends_at
      title: CreateProposalRequest
    CreateTripRequest:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
        destination:
          type: string
          minLength: 1
          title: Destination
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        timezone:
          type: string
          minLength: 1
          title: Timezone
          description: IANA timezone used for the trip's calendar dates, e.g. America/New_York.
      type: object
      required:
      - name
      - destination
      - start_date
      - end_date
      - timezone
      title: CreateTripRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InvitationResponse:
      properties:
        invitation_id:
          type: integer
          title: Invitation Id
        trip_id:
          type: integer
          title: Trip Id
        invited_user_id:
          type: integer
          title: Invited User Id
        invited_by_user_id:
          type: integer
          title: Invited By User Id
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - DECLINED
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        responded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Responded At
      type: object
      required:
      - invitation_id
      - trip_id
      - invited_user_id
      - invited_by_user_id
      - status
      - created_at
      - responded_at
      title: InvitationResponse
    ItineraryItemResponse:
      properties:
        item_id:
          type: integer
          title: Item Id
        trip_id:
          type: integer
          title: Trip Id
        proposal_id:
          type: integer
          title: Proposal Id
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        estimated_cost:
          type: string
          title: Estimated Cost
        location:
          type: string
          title: Location
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
        status:
          type: string
          const: ACTIVE
          title: Status
      type: object
      required:
      - item_id
      - trip_id
      - proposal_id
      - title
      - description
      - estimated_cost
      - location
      - starts_at
      - ends_at
      - status
      title: ItineraryItemResponse
    LoginRequest:
      properties:
        user_name:
          anyOf:
          - type: string
            maxLength: 30
            minLength: 1
          - type: 'null'
          title: User Name
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        password:
          type: string
          minLength: 1
          format: password
          title: Password
          writeOnly: true
      type: object
      required:
      - password
      title: LoginRequest
    OpenPollRequest:
      properties:
        deadline:
          type: string
          format: date-time
          title: Deadline
          description: Future deadline; voting stops at this instant.
      type: object
      required:
      - deadline
      title: OpenPollRequest
    PollResolution:
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          title: Decision
        resolved_by_user_id:
          type: integer
          title: Resolved By User Id
        resolved_at:
          type: string
          format: date-time
          title: Resolved At
      type: object
      required:
      - decision
      - resolved_by_user_id
      - resolved_at
      title: PollResolution
    PollResponse:
      properties:
        poll_id:
          type: integer
          title: Poll Id
        proposal_id:
          type: integer
          title: Proposal Id
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
          - CANCELED
          title: Status
        deadline:
          type: string
          format: date-time
          title: Deadline
        opened_at:
          type: string
          format: date-time
          title: Opened At
        closed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Closed At
        outcome:
          anyOf:
          - type: string
            enum:
            - APPROVED
            - REJECTED
            - TIED
          - type: 'null'
          title: Outcome
          description: Original automatic poll outcome, retained after resolution
            and cancellation.
        yes_count:
          type: integer
          title: Yes Count
        no_count:
          type: integer
          title: No Count
        total_votes:
          type: integer
          title: Total Votes
        eligible_voter_ids:
          items:
            type: integer
          type: array
          title: Eligible Voter Ids
        votes:
          items:
            $ref: '#/components/schemas/VoteResponse'
          type: array
          title: Votes
          description: One current counted choice per voter.
        voting_history:
          items:
            $ref: '#/components/schemas/VoteResponse'
          type: array
          title: Voting History
          description: All changed choices in event order.
        resolution:
          anyOf:
          - $ref: '#/components/schemas/PollResolution'
          - type: 'null'
      type: object
      required:
      - poll_id
      - proposal_id
      - status
      - deadline
      - opened_at
      - closed_at
      - outcome
      - yes_count
      - no_count
      - total_votes
      - eligible_voter_ids
      - votes
      - voting_history
      - resolution
      title: PollResponse
    ProposalResponse:
      properties:
        proposal_id:
          type: integer
          title: Proposal Id
        trip_id:
          type: integer
          title: Trip Id
        author_id:
          type: integer
          title: Author Id
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        estimated_cost:
          type: string
          title: Estimated Cost
        location:
