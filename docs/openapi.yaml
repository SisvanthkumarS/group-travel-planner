openapi: 3.1.0
info:
  title: Group Travel Planner
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email or username is already registered.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Set an access JWT and a Redis-backed opaque refresh credential
        in HttpOnly cookies.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid login credentials.
        '503':
          description: Redis authentication storage unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh
      description: Renew the access token and sliding session using the refresh cookie;
        no body required.
      operationId: refresh_api_v1_auth_refresh_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Refresh credential absent, invalid, revoked or expired.
        '503':
          description: Redis authentication storage unavailable.
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: Revoke this browser's refresh session and clear both authentication
        cookies.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '503':
          description: Cookies cleared but Redis revocation failed.
  /api/v1/trips:
    get:
      tags:
      - Trip Management
      summary: List Trips
      operationId: list_trips_api_v1_trips_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TripResponse'
                type: array
                title: Response List Trips Api V1 Trips Get
        '401':
          description: Authentication required.
    post:
      tags:
      - Trip Management
      summary: Create Trip
      operationId: create_trip_api_v1_trips_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '401':
          description: Authentication required.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}:
    get:
      tags:
      - Trip Management
      summary: Get Trip
      description: Get trip details and the complete member list; trip membership
        required.
      operationId: get_trip_api_v1_trips__trip_id__get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '401':
          description: Authentication required.
        '403':
          description: Trip membership required.
        '404':
          description: Trip not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Trip Management
      summary: Delete Trip
      description: Delete a trip as its Organizer; return an empty 204 response.
      operationId: delete_trip_api_v1_trips__trip_id__delete
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      responses:
        '204':
          description: Successful Response
        '401':
          description: Authentication required.
        '403':
          description: Organizer required.
        '404':
          description: Trip not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/invitations:
    post:
      tags:
      - Invitations
      summary: Create Invitation
      description: Create a pending invitation by email or user_name; Organizer only.
      operationId: create_invitation_api_v1_trips__trip_id__invitations_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication required.
        '403':
          description: Organizer required.
        '404':
          description: Trip or registered recipient not found.
        '409':
          description: Already a member or invitation already pending.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invitations:
    get:
      tags:
      - Invitations
      summary: List Invitations
      description: List all invitations received by the current user, newest first.
      operationId: list_invitations_api_v1_invitations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InvitationResponse'
                type: array
                title: Response List Invitations Api V1 Invitations Get
        '401':
          description: Authentication required.
    patch:
      tags:
      - Invitations
      summary: Respond To Invitation
      description: Accept or decline a pending invitation; only its recipient can
        respond.
      operationId: respond_to_invitation_api_v1_invitations_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondInvitationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication required.
        '403':
          description: Only the recipient can respond.
        '404':
          description: Invitation or trip not found.
        '409':
          description: Already answered, already a member, or trip is full.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/proposals:
    post:
      tags:
      - Activity Proposals
      summary: Create Proposal
      description: 'Submit a PENDING proposal as a trip participant.


        Activity times must be in the future and within the travel dates in the trip''s
        timezone.

        Description and non-negative estimated cost are required. At most 100 proposals

        are allowed per trip, including withdrawn and canceled proposals.'
      operationId: create_proposal_api_v1_trips__trip_id__proposals_post
      security:
      - CookieAuth: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Trip already contains 100 proposals.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Activity Proposals
      summary: List Proposals
      description: 'List all proposals, statuses, counts, poll outcomes and voting
        history; members only.


        Includes WITHDRAWN, REJECTED and CANCELLED proposals. Poll outcomes and tie

        decisions are retained after cancellation. Returns an empty array when none
        exist.'
      operationId: list_proposals_api_v1_trips__trip_id__proposals_get
      security:
      - CookieAuth: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProposalResponse'
                title: Response List Proposals Api V1 Trips  Trip Id  Proposals Get
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/proposals/{proposal_id}/withdraw:
    post:
      tags:
      - Activity Proposals
      summary: Withdraw Proposal
      description: 'Author only: withdraw a PENDING or OPEN proposal before the poll
        deadline.


        An open poll is canceled without an outcome. Existing votes and history remain,

        and further voting, opening a poll, or resolution is prohibited.'
      operationId: withdraw_proposal_api_v1_proposals__proposal_id__withdraw_post
      security:
      - CookieAuth: []
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Proposal Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Proposal is not PENDING/OPEN or poll deadline has passed.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/proposals/{proposal_id}/poll:
    post:
      tags:
      - Polls and Voting
      summary: Open Poll
      description: 'Organizer only: open a pending proposal''s poll and snapshot all
        current participants.


        The organizer and proposal author are eligible. Deadline must be after now
        and

        before the activity start. The internal scheduler closes polls automatically:

        more YES than NO approves and adds an itinerary item exactly once; more NO
        or

        zero votes rejects; equal nonzero counts produces TIED. No quorum is required.

        There is no public poll-closing endpoint.'
      operationId: open_poll_api_v1_proposals__proposal_id__poll_post
      security:
      - CookieAuth: []
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Proposal Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPollRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Proposal is not PENDING or already has a poll.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/polls/{poll_id}/vote:
    put:
      tags:
      - Polls and Voting
      summary: Vote
      description: 'Cast or update one YES/NO vote as an eligible participant strictly
        before the deadline.


        Eligibility is fixed at poll opening. Changed choices preserve the old choice
        in

        history; repeating the current choice is idempotent. Votes are rejected at
        the

        deadline even if the scheduler has not yet processed the poll.'
      operationId: vote_api_v1_polls__poll_id__vote_put
      security:
      - CookieAuth: []
      parameters:
      - name: poll_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Poll Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Poll/proposal is not OPEN or deadline reached.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/polls/{poll_id}/resolve:
    post:
      tags:
      - Polls and Voting
      summary: Resolve Poll
      description: 'Organizer only: approve or reject an automatically closed, tied
        proposal.


        Approval adds the activity to the itinerary exactly once. The original TIED

        outcome and the organizer''s resolution are both retained. Does not close
        polls.'
      operationId: resolve_poll_api_v1_polls__poll_id__resolve_post
      security:
      - CookieAuth: []
      parameters:
      - name: poll_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Poll Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolvePollRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '409':
          description: Poll has no unresolved TIED proposal.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/itinerary:
    get:
      tags:
      - Shared Itinerary
      summary: Get Itinerary
      description: 'Members only: retrieve active approved activities ordered by starts_at
        then item_id.


        Canceled activities are excluded. Returns an empty array when no active items
        exist.'
      operationId: get_itinerary_api_v1_trips__trip_id__itinerary_get
      security:
      - CookieAuth: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItineraryItemResponse'
                title: Response Get Itinerary Api V1 Trips  Trip Id  Itinerary Get
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/itinerary/{item_id}:
    delete:
      tags:
      - Shared Itinerary
      summary: Cancel Itinerary Item
      description: 'Organizer only: cancel an approved activity belonging to this
        trip.


        Sets the proposal and itinerary item to CANCELLED, preserving poll outcomes
        and

        voting history. Already canceled items also return an empty 204 response.'
      operationId: cancel_itinerary_item_api_v1_trips__trip_id__itinerary__item_id__delete
      security:
      - CookieAuth: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Trip Id
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          exclusiveMinimum: 0
          title: Item Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Authentication required.
        '403':
          description: Required membership, authorship, organizer role, or eligibility
            missing
        '404':
          description: Requested resource not found in this trip.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications:
    get:
      tags:
      - Notifications
      summary: List Notifications
      description: 'List only your in-app history, newest ID first. Reads do not mark
        items read.


        Pass next_before_id as before_id for the next page. Existing history remains

        available after opting out. Email-only records are never exposed here.'
      operationId: list_notifications_api_v1_notifications_get
      parameters:
      - name: unread_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Unread Only
      - name: before_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Before Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          description: Authentication required.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications/unread-count:
    get:
      tags:
      - Notifications
      summary: Unread Count
      description: Count all your unread in-app notifications, independently of pagination.
      operationId: unread_count_api_v1_notifications_unread_count_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          description: Authentication required.
  /api/v1/notifications/preferences:
    get:
      tags:
      - Notifications
      summary: Get Preferences
      description: 'Return your saved preferences. Defaults: in-app on, email off.'
      operationId: get_preferences_api_v1_notifications_preferences_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          description: Authentication required.
    put:
      tags:
      - Notifications
      summary: Update Preferences
      description: 'Replace both preferences. Disabling email also cancels pending
        deliveries.


        Changes apply to future events; enabling a channel never backfills past events.

        In-app history is retained. An email already submitted cannot be recalled.

        SMTP must also be enabled by the server operator for email delivery.'
      operationId: update_preferences_api_v1_notifications_preferences_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          description: Authentication required.
        '403':
          description: CSRF validation failed.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications/read-all:
    post:
      tags:
      - Notifications
      summary: Mark All Read
      description: 'Mark your unread items read, optionally only through the newest
        loaded ID.


        Send {} to mark all currently visible items. Repeating the request is safe.'
      operationId: mark_all_read_api_v1_notifications_read_all_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAllReadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResponse'
        '401':
          description: Authentication required.
        '403':
          description: CSRF validation failed.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications/{notification_id}/read:
    patch:
      tags:
      - Notifications
      summary: Mark Read
      description: Mark one item read. Repeating the request preserves its original
        read time.
      operationId: mark_read_api_v1_notifications__notification_id__read_patch
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Notification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          description: Authentication required.
        '403':
          description: CSRF validation failed.
        '404':
          description: Notification absent or not in your in-app inbox.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications/test-email:
    post:
      tags:
      - Notifications
      summary: Send Test Email
      description: 'Email the signed-in user''s stored address. No request body is
        needed.


        Enable EMAIL_TEST_ENABLED temporarily to use this diagnostic event.

        Success means provider acceptance, not confirmed inbox delivery.'
      operationId: send_test_email_api_v1_notifications_test_email_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailResponse'
        '401':
          description: Authentication required.
        '403':
          description: CSRF validation failed.
        '404':
          description: Test email event is disabled.
        '502':
          description: Email submission failed; delivery may be uncertain after a
            timeout.
        '503':
          description: Email sending is disabled.
components:
  schemas:
    CreateInvitationRequest:
      properties:
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        user_name:
          anyOf:
          - type: string
            maxLength: 30
            minLength: 1
          - type: 'null'
          title: User Name
      type: object
      title: CreateInvitationRequest
    CreateProposalRequest:
      properties:
        title:
          type: string
          minLength: 1
          title: Title
        description:
          type: string
          minLength: 1
          title: Description
        estimated_cost:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          title: Estimated Cost
        location:
          type: string
          minLength: 1
          title: Location
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
      type: object
      required:
      - title
      - description
      - estimated_cost
      - location
