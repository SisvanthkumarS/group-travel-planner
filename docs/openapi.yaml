openapi: 3.1.0
info:
  title: Group Travel Planner
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email or username is already registered.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Sign in with email or a unique username and set an HttpOnly JWT
        cookie.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid login credentials.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: Clear the browser cookie; a previously issued JWT is not revoked
        server-side.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/v1/trips:
    get:
      tags:
      - Trip Management
      summary: List Trips
      description: List trips accessible to the current user. Scaffold currently returns
        501.
      operationId: list_trips_api_v1_trips_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TripResponse'
                type: array
                title: Response List Trips Api V1 Trips Get
        '401':
          description: Authentication required.
        '501':
          description: Trip business logic is not implemented yet.
    post:
      tags:
      - Trip Management
      summary: Create Trip
      description: Create a trip and its Organizer membership. Scaffold currently
        returns 501.
      operationId: create_trip_api_v1_trips_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '401':
          description: Authentication required.
        '501':
          description: Trip business logic is not implemented yet.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}:
    get:
      tags:
      - Trip Management
      summary: Get Trip
      description: Get trip details and members. Scaffold currently returns 501.
      operationId: get_trip_api_v1_trips__trip_id__get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '401':
          description: Authentication required.
        '501':
          description: Trip business logic is not implemented yet.
        '403':
          description: Trip membership required.
        '404':
          description: Trip not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Trip Management
      summary: Delete Trip
      description: Delete a trip as its Organizer. Scaffold currently returns 501.
      operationId: delete_trip_api_v1_trips__trip_id__delete
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      responses:
        '204':
          description: Successful Response
        '401':
          description: Authentication required.
        '501':
          description: Trip business logic is not implemented yet.
        '403':
          description: Organizer required.
        '404':
          description: Trip not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CreateTripRequest:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
        destination:
          type: string
          minLength: 1
          title: Destination
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
      type: object
      required:
      - name
      - destination
      - start_date
      - end_date
      title: CreateTripRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        user_name:
          anyOf:
          - type: string
            maxLength: 30
            minLength: 1
          - type: 'null'
          title: User Name
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        password:
          type: string
          minLength: 1
          format: password
          title: Password
          writeOnly: true
      type: object
      required:
      - password
      title: LoginRequest
    RegisterRequest:
      properties:
        user_name:
          type: string
          maxLength: 30
          minLength: 1
          title: User Name
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          minLength: 1
          format: password
          title: Password
          writeOnly: true
      type: object
      required:
      - user_name
      - email
      - password
      title: RegisterRequest
    TripDetailResponse:
      properties:
        trip_id:
          type: integer
          title: Trip Id
        name:
          type: string
          title: Name
        destination:
          type: string
          title: Destination
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        organizer_id:
          type: integer
          title: Organizer Id
        members:
          items:
            $ref: '#/components/schemas/TripMemberResponse'
          type: array
          title: Members
      type: object
      required:
      - trip_id
      - name
      - destination
      - start_date
      - end_date
      - organizer_id
      - members
      title: TripDetailResponse
    TripMemberResponse:
      properties:
        user_id:
          type: integer
          title: User Id
        user_name:
          type: string
          title: User Name
        role:
          type: string
          enum:
          - ORGANIZER
          - MEMBER
          title: Role
        joined_at:
          type: string
          format: date-time
          title: Joined At
      type: object
      required:
      - user_id
      - user_name
      - role
      - joined_at
      title: TripMemberResponse
    TripResponse:
      properties:
        trip_id:
          type: integer
          title: Trip Id
        name:
          type: string
          title: Name
        destination:
          type: string
          title: Destination
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        organizer_id:
          type: integer
          title: Organizer Id
      type: object
      required:
      - trip_id
      - name
      - destination
      - start_date
      - end_date
      - organizer_id
      title: TripResponse
    UserResponse:
      properties:
        user_name:
          type: string
          title: User Name
        user_id:
          type: integer
          title: User Id
        email:
          type: string
          title: Email
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - user_name
      - user_id
      - email
      - created_at
      title: UserResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
