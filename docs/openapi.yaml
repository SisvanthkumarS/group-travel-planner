openapi: 3.1.0
info:
  title: Group Travel Planner
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email or username is already registered.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Sign in with email or a unique username and set an HttpOnly JWT
        cookie.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid login credentials.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: Clear the browser cookie; a previously issued JWT is not revoked
        server-side.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/v1/trips:
    get:
      tags:
      - Trip Management
      summary: List Trips
      operationId: list_trips_api_v1_trips_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TripResponse'
                type: array
                title: Response List Trips Api V1 Trips Get
        '401':
          description: Authentication required.
    post:
      tags:
      - Trip Management
      summary: Create Trip
      operationId: create_trip_api_v1_trips_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '401':
          description: Authentication required.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}:
    get:
      tags:
      - Trip Management
      summary: Get Trip
      description: Get trip details and the complete member list; trip membership
        required.
      operationId: get_trip_api_v1_trips__trip_id__get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '401':
          description: Authentication required.
        '403':
          description: Trip membership required.
        '404':
          description: Trip not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Trip Management
      summary: Delete Trip
      description: Delete a trip as its Organizer; return an empty 204 response.
      operationId: delete_trip_api_v1_trips__trip_id__delete
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      responses:
        '204':
          description: Successful Response
        '401':
          description: Authentication required.
        '403':
          description: Organizer required.
        '404':
          description: Trip not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/invitations:
    post:
      tags:
      - Invitations
      summary: Create Invitation
      description: Create a pending invitation by email or user_name; Organizer only.
      operationId: create_invitation_api_v1_trips__trip_id__invitations_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Trip ID
          title: Trip Id
        description: Trip ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication required.
        '403':
          description: Organizer required.
        '404':
          description: Trip or registered recipient not found.
        '409':
          description: Already a member or invitation already pending.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invitations:
    get:
      tags:
      - Invitations
      summary: List Invitations
      description: List all invitations received by the current user, newest first.
      operationId: list_invitations_api_v1_invitations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InvitationResponse'
                type: array
                title: Response List Invitations Api V1 Invitations Get
        '401':
          description: Authentication required.
    patch:
      tags:
      - Invitations
      summary: Respond To Invitation
      description: Accept or decline a pending invitation; only its recipient can
        respond.
      operationId: respond_to_invitation_api_v1_invitations_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondInvitationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Authentication required.
        '403':
          description: Only the recipient can respond.
        '404':
          description: Invitation or trip not found.
        '409':
          description: Already answered, already a member, or trip is full.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CreateInvitationRequest:
      properties:
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        user_name:
          anyOf:
          - type: string
            maxLength: 30
            minLength: 1
          - type: 'null'
          title: User Name
      type: object
      title: CreateInvitationRequest
    CreateTripRequest:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
        destination:
          type: string
          minLength: 1
          title: Destination
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
      type: object
      required:
      - name
      - destination
      - start_date
      - end_date
      title: CreateTripRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InvitationResponse:
      properties:
        invitation_id:
          type: integer
          title: Invitation Id
        trip_id:
          type: integer
          title: Trip Id
        invited_user_id:
          type: integer
          title: Invited User Id
        invited_by_user_id:
          type: integer
          title: Invited By User Id
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - DECLINED
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        responded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Responded At
      type: object
      required:
      - invitation_id
      - trip_id
      - invited_user_id
      - invited_by_user_id
      - status
      - created_at
      - responded_at
      title: InvitationResponse
    LoginRequest:
      properties:
        user_name:
          anyOf:
          - type: string
            maxLength: 30
            minLength: 1
          - type: 'null'
          title: User Name
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        password:
          type: string
          minLength: 1
          format: password
          title: Password
          writeOnly: true
      type: object
      required:
      - password
      title: LoginRequest
    RegisterRequest:
      properties:
        user_name:
          type: string
          maxLength: 30
          minLength: 1
          title: User Name
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          minLength: 1
          format: password
          title: Password
          writeOnly: true
      type: object
      required:
      - user_name
      - email
      - password
      title: RegisterRequest
    RespondInvitationRequest:
      properties:
        invitation_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Invitation Id
        decision:
          type: string
          enum:
          - ACCEPT
          - DECLINE
          title: Decision
      type: object
      required:
      - invitation_id
      - decision
      title: RespondInvitationRequest
    TripDetailResponse:
      properties:
        trip_id:
          type: integer
          title: Trip Id
        name:
          type: string
          title: Name
        destination:
          type: string
          title: Destination
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        organizer_id:
          type: integer
          title: Organizer Id
        members:
          items:
            $ref: '#/components/schemas/TripMemberResponse'
          type: array
          title: Members
      type: object
      required:
      - trip_id
      - name
      - destination
      - start_date
      - end_date
      - organizer_id
      - members
      title: TripDetailResponse
    TripMemberResponse:
      properties:
        user_id:
          type: integer
          title: User Id
        user_name:
          type: string
          title: User Name
        role:
          type: string
          enum:
          - ORGANIZER
          - MEMBER
          title: Role
        joined_at:
          type: string
          format: date-time
          title: Joined At
      type: object
      required:
      - user_id
      - user_name
      - role
      - joined_at
      title: TripMemberResponse
    TripResponse:
      properties:
        trip_id:
          type: integer
          title: Trip Id
        name:
          type: string
          title: Name
        destination:
          type: string
          title: Destination
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        organizer_id:
          type: integer
          title: Organizer Id
      type: object
      required:
      - trip_id
      - name
      - destination
      - start_date
      - end_date
      - organizer_id
      title: TripResponse
    UserResponse:
      properties:
        user_name:
          type: string
          title: User Name
        user_id:
          type: integer
          title: User Id
        email:
          type: string
          title: Email
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - user_name
      - user_id
      - email
      - created_at
      title: UserResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
