include:
  - ./compose.base.yml
services:
  backend:
    image: astral/uv:0.13.5-debian-slim
    working_dir: /opt/app
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://default:${REDIS_PASSWORD}@redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      JWT_SESSION_MAX_DAYS: ${JWT_SESSION_MAX_DAYS:-30}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-access_token}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refresh_token}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      CORS_ORIGINS: '["http://localhost:5173"]'
    command: ['sleep', 'infinity']
    ports:
      - '8000:8000'
    volumes:
      - ../backend:/opt/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:26-alpine
    command:
      - /bin/sh
      - -ec
      - |
        npm install -g pnpm@12.15.0
        pnpm install --frozen-lockfile
        pnpm --filter frontend dev
    working_dir: /opt/app
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      HUSKY: '0'
    ports:
      - '5173:5173'
    volumes:
      - ../frontend:/opt/app/frontend
      - ../package.json:/opt/app/package.json
      - ../pnpm-lock.yaml:/opt/app/pnpm-lock.yaml
      - ../pnpm-workspace.yaml:/opt/app/pnpm-workspace.yaml
      - frontend_modules:/opt/app/node_modules
      - frontend_workspace_modules:/opt/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  frontend_modules:
  frontend_workspace_modules:
