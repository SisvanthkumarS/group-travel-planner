include:
  - ./compose.base.yml
services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.dockerfile
    working_dir: /opt/app
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://default:${REDIS_PASSWORD}@redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      JWT_SESSION_MAX_DAYS: ${JWT_SESSION_MAX_DAYS:-30}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-access_token}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refresh_token}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_TEST_ENABLED: ${EMAIL_TEST_ENABLED:-false}
      EMAIL_TIMEOUT_SECONDS: ${EMAIL_TIMEOUT_SECONDS:-10}
      NOTIFICATION_EMAIL_WORKER_ENABLED: ${NOTIFICATION_EMAIL_WORKER_ENABLED:-true}
      NOTIFICATION_EMAIL_INTERVAL_SECONDS: ${NOTIFICATION_EMAIL_INTERVAL_SECONDS:-5}
      NOTIFICATION_EMAIL_BATCH_SIZE: ${NOTIFICATION_EMAIL_BATCH_SIZE:-20}
      NOTIFICATION_EMAIL_MAX_ATTEMPTS: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:-5}
      NOTIFICATION_EMAIL_RETRY_SECONDS: ${NOTIFICATION_EMAIL_RETRY_SECONDS:-60}
      NOTIFICATION_EMAIL_LEASE_SECONDS: ${NOTIFICATION_EMAIL_LEASE_SECONDS:-600}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Group Travel Planner}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - '8000:8000'
    volumes:
      - ../backend:/opt/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/openapi.json', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    image: node:26-alpine
    command:
      - /bin/sh
      - -ec
      - |
        npm install -g pnpm@12.15.0
        pnpm install --frozen-lockfile
        pnpm --filter frontend dev
    working_dir: /opt/app
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      HUSKY: '0'
    ports:
      - '5173:5173'
    volumes:
      - ../frontend:/opt/app/frontend
      - ../package.json:/opt/app/package.json
      - ../pnpm-lock.yaml:/opt/app/pnpm-lock.yaml
      - ../pnpm-workspace.yaml:/opt/app/pnpm-workspace.yaml
      - frontend_modules:/opt/app/node_modules
      - frontend_workspace_modules:/opt/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  frontend_modules:
  frontend_workspace_modules:
