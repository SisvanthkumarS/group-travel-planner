include:
  - ./compose.base.yml
services:
  localhost-tls:
    image: alpine/openssl:3.5.9
    restart: 'no'
    command:
      [
        'req',
        '-x509',
        '-newkey',
        'rsa:2048',
        '-sha256',
        '-noenc',
        '-days',
        '365',
        '-subj',
        '/CN=localhost',
        '-addext',
        'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:::1',
        '-addext',
        'basicConstraints=critical,CA:FALSE',
        '-addext',
        'keyUsage=critical,digitalSignature,keyEncipherment',
        '-addext',
        'extendedKeyUsage=serverAuth',
        '-keyout',
        '/certs/privkey.pem',
        '-out',
        '/certs/fullchain.pem',
      ]
    volumes:
      - ./certs:/certs
  backend:
    image: hubertchang/course:backend-latest
    command:
      [
        'uvicorn',
        'backend.app.main:app',
        '--app-dir',
        '/opt/app',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--ssl-certfile',
        '/opt/app/certs/fullchain.pem',
        '--ssl-keyfile',
        '/opt/app/certs/privkey.pem',
        '--reload',
        '--reload-dir',
        '/opt/app/backend',
      ]
    working_dir: /opt/app
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_TEST_ENABLED: ${EMAIL_TEST_ENABLED:-false}
      EMAIL_TIMEOUT_SECONDS: ${EMAIL_TIMEOUT_SECONDS:-10}
      NOTIFICATION_EMAIL_WORKER_ENABLED: ${NOTIFICATION_EMAIL_WORKER_ENABLED:-true}
      NOTIFICATION_EMAIL_INTERVAL_SECONDS: ${NOTIFICATION_EMAIL_INTERVAL_SECONDS:-5}
      NOTIFICATION_EMAIL_BATCH_SIZE: ${NOTIFICATION_EMAIL_BATCH_SIZE:-20}
      NOTIFICATION_EMAIL_MAX_ATTEMPTS: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:-5}
      NOTIFICATION_EMAIL_RETRY_SECONDS: ${NOTIFICATION_EMAIL_RETRY_SECONDS:-60}
      NOTIFICATION_EMAIL_LEASE_SECONDS: ${NOTIFICATION_EMAIL_LEASE_SECONDS:-600}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-notifications@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Group Travel Planner}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localhost-tls:
        condition: service_completed_successfully

  frontend:
    image: hubertchang/course:frontend-latest
    command:
      [
        'serve',
        '-s',
        'dist',
        '-c',
        '/app/serve.json',
        '-l',
        'tcp://0.0.0.0:3000',
        '--ssl-cert',
        '/app/certs/fullchain.pem',
        '--ssl-key',
        '/app/certs/privkey.pem',
      ]
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://localhost:8000/api/v1}
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_started
