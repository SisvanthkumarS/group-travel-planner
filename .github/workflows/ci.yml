name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      DATABASE_URL: postgresql+psycopg://travel:ci-only@localhost:5432/travel
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d travel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.1.1
        with:
          runtime: node@26
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: '3.15'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project backend --frozen
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run db:migrate
      - name: Verify PostgreSQL constraints and model metadata
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run --project backend pytest -c backend/pyproject.toml tests/backend/test_database_schema.py tests/backend/AiChat_test.py tests/backend/test_auth_integration.py tests/backend/test_trip_integration.py tests/backend/test_invitation_integration.py tests/backend/test_refresh_redis_integration.py
          uv run --project backend alembic -c backend/alembic.ini check
      - run: uv run --project backend alembic -c backend/alembic.ini downgrade base
      - run: pnpm run db:migrate
