[project]
name = "group-travel-planner-api"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
  "fastapi>=0.159.1,<1",
  "uvicorn[standard]>=0.54.0,<1",
  "sqlalchemy>=2.1.6,<3",
  "psycopg[binary]>=3.3.6,<4",
  "alembic>=1.20.1,<2",
  "pydantic-settings>=2.16.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "httpx2>=2.16.0,<3",
    "ruff>=0.17.1,<1",
    "pyyaml>=6.0.3,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/backend"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
